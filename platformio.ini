; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
; Pinned: espressif32 6.13.0 ships framework-espidf 3.50503.0 == ESP-IDF 5.5.3.
; I2C driver: new `driver/i2c_master.h` (not legacy i2c_cmd_link).
platform = espressif32@6.13.0
board = esp32-s3-devkitm-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, default

; Host-side unit tests for ESP-IDF-free code (Ema): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -Iinclude -std=gnu++17
test_build_src = no
